name: Deploy Backend + Frontend
on:
  push:
    branches: [main]
    paths:
      - 'lambda/**'
      - 'infra/**'
      - 'src/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC assume role
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lambda/package-lock.json

      - name: Typecheck (lambda)
        working-directory: lambda
        run: |
          npm ci
          npx tsc --noEmit
          npm run typecheck:test

      - name: Test (lambda)
        working-directory: lambda
        run: npm test

      - name: Typecheck (frontend)
        run: |
          npm ci
          npm run typecheck

      - name: Install ccloud CLI
        run: |
          if ! command -v ccloud &> /dev/null; then
            # tarball punya entry './' → ekstrak ke subdir milik runner (bukan /tmp
            # yang tak bisa di-chmod oleh non-root), lalu taruh di PATH.
            mkdir -p /tmp/ccloud-cli
            curl -fsSL https://binaries.cockroachdb.com/ccloud/ccloud_linux-amd64_0.6.12.tar.gz -o /tmp/ccloud.tar.gz
            tar -xzf /tmp/ccloud.tar.gz -C /tmp/ccloud-cli
            chmod +x /tmp/ccloud-cli/ccloud
            echo "/tmp/ccloud-cli" >> "$GITHUB_PATH"
          fi
          ccloud --version || /tmp/ccloud-cli/ccloud --version

      - name: CockroachDB Cloud audit (ccloud CLI health gate)
        run: |
          bash scripts/ccloud-audit.sh --quiet
        env:
          CRDB_CLUSTER_NAME: ${{ secrets.CRDB_CLUSTER_NAME }}
          CCLOUD_API_KEY: ${{ secrets.CCLOUD_API_KEY }}

      - name: Build Lambda zip
        run: bash scripts/build-lambda.sh

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_crdb_connection_url: ${{ secrets.CRDB_CONNECTION_URL }}
          TF_VAR_crdb_cluster_id: ${{ secrets.CRDB_CLUSTER_ID }}
          TF_VAR_ccloud_api_key: ${{ secrets.CCLOUD_API_KEY }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
          TF_VAR_email_from: ${{ secrets.EMAIL_FROM }}
          TF_VAR_app_url: ${{ secrets.APP_URL }}
          TF_VAR_allowed_origin: ${{ secrets.ALLOWED_ORIGIN }}
          TF_VAR_grafana_otlp_endpoint: ${{ secrets.GRAFANA_OTLP_ENDPOINT }}
          TF_VAR_grafana_otlp_headers: ${{ secrets.GRAFANA_OTLP_HEADERS }}

      - name: Deploy frontend (S3 + CloudFront)
        run: bash scripts/deploy-frontend.sh
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Health check (backend)
        run: |
          sleep 20
          curl -f ${{ secrets.API_URL }}/api/v1/health || exit 1

      - name: Health check (frontend via CloudFront)
        run: |
          sleep 20
          curl -f ${{ secrets.APP_URL }}/ || exit 1
          curl -f ${{ secrets.APP_URL }}/api/v1/health || exit 1
