server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend upstream (Lambda Function URL) — injected at container start
    # via envsubst (see Dockerfile CMD). Default empty = frontend-only mode.
    set $backend_url "${BACKEND_URL}";

    # SPA fallback — every unknown route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — same-origin /api/v1 → backend (satisfies CSP connect-src 'self')
    location /api/v1/ {
        if ($backend_url = "") {
            return 503;
        }
        resolver 8.8.8.8 valid=30s;
        proxy_pass $backend_url$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Device-Id $http_x_device_id;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Cache-busting: hashed assets from Vite get long cache
    location ~* \.[0-9a-f]{8}\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Prevent caching the SPA shell
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Security headers — zero-cloud, all on-device
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' blob: https://cbt-memory-exports.s3.ap-southeast-3.amazonaws.com; font-src 'self'; base-uri 'self'; form-action 'self';" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
}
